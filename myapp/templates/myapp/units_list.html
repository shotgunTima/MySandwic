{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Единицы измерения</title>
    <link rel="stylesheet" href="{% static 'myapp/css/Style.css' %}">
    <style>
        .sandwich-table-container {
            width: 50%;
            margin: 50px auto;
            position: relative;
            padding-top: 100px;
            padding-bottom: 100px;
        }

        .sandwich-table-container::before {
            content: "";
            background-image: url("{% static 'myapp/img/sandwichTop.png' %}");
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            position: absolute;
            top: 42px;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            height: 130px;
            z-index: 3;
            pointer-events: none;
        }

        .sandwich-table-container::after {
            content: "";
            background-image: url("{% static 'myapp/img/sandwichBottom.png' %}");
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            position: absolute;
            bottom: 74px;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            height: 40px;
            z-index: 3;
            pointer-events: none;
        }

        .table {
            width: 100%;
            border: 3px solid rgba(40, 40, 39, 1);
            background-color: rgba(40, 40, 39, 1);
            position: relative;
            z-index: 2;
            border-radius: 12px;
            overflow: hidden;
        }

        .table td, .table th {
            background-color: #fff;
            padding: 15px;
            text-align: center;
        }

        .table th {
            background-color: #f2d9b1;
            color: #6d4c41;
        }

        .add-btn-container {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 10px;
        }

        .add-btn {
            background-color: #FFFFFF;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 18px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .add-btn:hover {
            background-color: #FFEEE3;
        }
    </style>
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="container">
                <a href="/" class="logo">MySandwich</a>
                <ul>
                    <li><a href="{% url 'finishedgoods_list' %}">Готовая продукция</a></li>
                    <li><a href="{% url 'rawmaterials_list' %}">Сырьё</a></li>
                    <li><a href="{% url 'ingredients_list' %}">Ингредиенты</a></li>
                    <li><a href="{% url 'units_list' %}">Единицы измерения</a></li>
                    <li><a href="{% url 'budget_list' %}">Бюджет</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <main class="main-content">
        <div class="container">
            <h5 class="titleTbl">Единицы измерения</h5>

            <div class="table-container">
                <div class="sandwich-table-container">
                    <div class="add-btn-container">
                        <a href="{% url 'unit_create' %}" class="btn add-btn" title="Добавить">➕</a>
                    </div>
                    <table class="table">
                        <thead>
                            <tr>
                                <th>Название</th>
                                <th>Действия</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for unit in units %}
                            <tr>
                                <td>{{ unit.unitname }}</td>
                                <td>
                                    <a href="{% url 'unit_update' unit.pk %}" class="btn edit-btn" title="Редактировать">✏️</a>
                                    <a href="{% url 'unit_delete' unit.pk %}" class="btn delete-btn" title="Удалить">🗑️</a>
                                </td>
                            </tr>
                            {% empty %}
                            <tr>
                                <td colspan="2">Нет данных</td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
<footer>
        <p>&copy; 2025 MySandwich. Все права защищены.</p>
    </footer>
</body>
</html>
